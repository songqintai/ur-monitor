name: 每小时抓取UR房源数据

on:
  schedule:
    # cron 用的是 UTC 时间，'0 * * * *' 表示每小时的第0分钟触发一次
    - cron: '0 * * * *'
  workflow_dispatch: {} # 允许在 GitHub 网页上手动点一下触发，方便测试

# 需要写权限才能把抓到的数据提交回仓库
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 抓取数据
        run: node scripts/fetchData.js

      - name: 提交更新后的数据文件
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '自动更新房源数据 (每小时定时任务)'
          file_pattern: 'docs/data/rooms.json'